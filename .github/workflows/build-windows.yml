
name: Compilar Guto Crosshair para Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: x86
            rid: win-x86
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publicar executável
        run: dotnet publish GutoCrosshair.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/${{ matrix.rid }}

      - name: Disponibilizar executável
        uses: actions/upload-artifact@v4
        with:
          name: GutoCrosshair-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/GutoCrosshair.exe
          if-no-files-found: error
